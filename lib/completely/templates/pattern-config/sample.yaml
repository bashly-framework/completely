patterns:
  - mygit [root options]
  - mygit init [init options] <directory>
  - mygit status [status options]

options:
  root:
    - -h|--help
    - -v|--version
  init:
    - --bare
  status:
    - --help
    - --branch|-b <branch>
    - --format <format>
    - --verbose

tokens:
  directory: directory
  branch: $(git branch --format='%(refname:short)' 2>/dev/null)
  format: [short, long]
